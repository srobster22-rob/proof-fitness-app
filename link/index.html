<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROOF</title>
<meta name="theme-color" content="#08090A">

<!-- Chat unfurl. NOTE: these are static and generic on purpose. The workout
     rides in the URL fragment, which is never sent to a server, so nothing here
     can be personalised without a backend. See README.md — this is a deliberate
     trade of unfurl conversion for having no server and no training data. -->
<meta property="og:title" content="A lift worth showing you">
<meta property="og:description" content="Logged in PROOF. Free, no account, no trial.">
<!-- og.png is generated by og.cjs and deployed by build.cjs. Crawlers require an
     ABSOLUTE url, so only the domain below needs replacing, not the filename. -->
<meta property="og:image" content="https://example.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root{ --bg:#08090A; --volt:#CCFF00; --muted:#7C8792; --line:#1C2126; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#F2F4F6;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));gap:22px}

  .stage{position:relative;width:min(300px,78vw);aspect-ratio:9/16;flex:0 0 auto}
  canvas{width:100%;height:100%;display:block;border-radius:20px;background:#000;
    box-shadow:0 26px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05)}
  .replay{position:absolute;inset:auto 10px 10px auto;background:rgba(8,9,10,.66);
    border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;
    padding:7px 13px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}

  .copy{text-align:center;max-width:400px}
  .copy h1{font-size:26px;line-height:1.22;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
  .copy p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}

  .cta{width:min(400px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}
  a.get{display:block;width:100%;text-align:center;background:var(--volt);color:#000;
    text-decoration:none;font-weight:800;font-size:16.5px;padding:16px;border-radius:14px;
    letter-spacing:-.01em}
  a.get:active{transform:scale(.985)}
  .terms{display:flex;gap:14px;color:#4E5762;font-size:12px;flex-wrap:wrap;justify-content:center}
  .terms b{color:#6E7A85;font-weight:600}

  footer{color:#39414A;font-size:11.5px;text-align:center;margin-top:auto;padding-top:18px}
</style>
</head>
<body>

<div class="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <button class="replay" id="replay">Replay</button>
</div>

<div class="copy">
  <h1 id="headline">&nbsp;</h1>
  <p id="sub">&nbsp;</p>
</div>

<div class="cta">
  <a class="get" id="get" href="#">&nbsp;</a>
  <div class="terms">
    <span><b>No account.</b> Ever</span>
    <span><b>No trial.</b> No paywall</span>
    <span><b>Your data</b> stays on your phone</span>
  </div>
</div>

<footer>Nothing about this workout was sent to a server — it travelled inside the link.</footer>

<!-- Source points at the real design source of truth so this page runs in place.
     build.cjs rewrites this to ./recap.js and copies the file, so dist/ is self-contained. -->
<script src="../spike/recap.js"></script>
<script src="./share-url.js"></script>
<script src="./copy.js"></script>
<script>
// ---- App Store destination -------------------------------------------------
// `ct` is an App Store Connect campaign token: it gives AGGREGATE install counts
// per campaign, with no per-user tracking and no SDK. That is enough to answer
// "is the link path working?" and nothing more, which is the intended ceiling.
const APP_ID = '0000000000';
const PROVIDER_TOKEN = '000000';

// Campaign taxonomy. `ct` is capped at 40 chars by App Store Connect and only
// ever reports in aggregate, so it encodes the two things worth splitting on —
// which copy variant, and which kind of send — and nothing identifying.
//   share-<variant>-<surface>      e.g. share-c-dm
const STORE = (variant, surface) =>
  `https://apps.apple.com/app/id${APP_ID}?pt=${PROVIDER_TOKEN}` +
  `&ct=${encodeURIComponent(`share-${variant}-${surface || 'dm'}`)}&mt=8`;

const SAMPLE = {
  title: 'PUSH DAY', date: 'TUE 28 JUL', volume: 18420, sets: 24,
  duration: '52 MIN', streak: 12, unit: 'lb', watermark: Copy.NAME,
  pr: { lift: 'BENCH PRESS', weight: 225, reps: 5, prev: 215 },
  lifts: [['Bench Press','225 × 5',true],['Incline DB Press','80 × 10',false],
          ['Cable Fly','45 × 12',false],['OHP','135 × 6',false],
          ['Lateral Raise','25 × 15',false]]
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });

const shared = ShareURL.readURL();
const data = shared || SAMPLE;
const variant = Copy.pick();
const surface = (location.search.match(/[?&]s=([a-z]{2,6})/) || [])[1];

const text = Copy.resolve(variant, shared);
document.getElementById('headline').textContent = text.h;
document.getElementById('sub').textContent = text.s;
const get = document.getElementById('get');
get.textContent = variant.cta;
get.href = STORE(variant.id, surface);
document.documentElement.dataset.variant = variant.id;

// ---- play the recap --------------------------------------------------------
/*
 * The card is the nice half of this page; the headline and the install button
 * are its JOB (§5 — "a tappable install path beside the file"). So a card that
 * cannot draw must not take the CTA down with it.
 *
 * Every value on this card arrives from a URL fragment written by some version
 * of the app — not necessarily THIS version — so the renderer is being fed
 * input it cannot fully trust. It has thrown on that input twice: an unguarded
 * `D.pr.weight` blanked the link for every first-ever workout (no PR exists
 * before three sessions, §8), and `D.lifts.length` did the same for a payload
 * whose lift list was legitimately omitted. Both are fixed; the third one has
 * not been written yet. Without this guard it fails the same way — a blank
 * box, an uncaught error, and the two lines below never run, so the page loses
 * its animation AND the visitor is looking at an empty stage.
 *
 * Hidden rather than left empty: an empty framed box reads as broken, while a
 * page that is just headline + button reads as a landing page.
 */
let raf = null;
function draw(t) {
  try {
    RecapRender.render(ctx, t, { data });
    return true;
  } catch (e) {
    cancelAnimationFrame(raf);
    document.querySelector('.stage').hidden = true;
    return false;
  }
}

function play() {
  cancelAnimationFrame(raf);
  const t0 = performance.now();
  (function step(now) {
    const t = (now - t0) / 1000;
    if (!draw(Math.min(t, RecapRender.DURATION))) return;
    if (t < RecapRender.DURATION) raf = requestAnimationFrame(step);
  })(t0);
}
document.getElementById('replay').onclick = play;

// Render the final frame immediately so there is never a blank box, then animate.
if (draw(RecapRender.DURATION) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  requestAnimationFrame(play);
}
</script>
</body>
</html>
